<form [formGroup]="controlsForm">
  <app-title-page [title]="'Recaudaciones'"></app-title-page>

  <div class="card-table-filters">
    <div class="card-body">
        <!--FILTROS-->
      <div class="card-filtros">
        <div class="card-filtros__actions">
          
          <div class="select-wrapper">
            <label class="placeholder">Canal de pago</label>
            <div class="custom-select-container">
              <select formControlName="chanelPayment" class="custom-select">
                 of list"
                <option  value="">Seleccione una opción</option>
                <option *ngFor="let item of paymentChannels" value="{{item.value}}">{{item.label}}</option>
            
              </select>
            </div>
          </div>

          <div class="date-wrapper">
            <label style="margin-left: 10px;" class="placeholder">desde</label>
            <app-ip-date-input 
              [control]="controlsForm.controls.dateStart"
              [max]="maxStart"
              (changed)="onStartDatechange($event)">
            </app-ip-date-input>
          </div>

          <div class="date-wrapper">
            <label style="margin-left: 10px;" class="placeholder">hasta</label>
            <app-ip-date-input
              [control]="controlsForm.controls.dateEnd"
              [max]="maxEnd"
              [min]="minEnd"
              (changed)="onEndDateChange($event)">
            </app-ip-date-input>
          </div>

          <div class="date-wrapper">
            <button class="search" (click)="onClickFiltredSearch()">
              <img src="../../../assets/new-styles/icons/buttons/search-icon-white.svg">
            </button>
          </div>
          
        </div>
      </div>
    </div>
    
    <!--TABLA-->
    <div *ngIf="!isMobile" class="card-table">     
      <app-table
        [keyTranslate]="'IP.ADMIN_TABLE'"
        [propertyOrder]="columnsHeaders"
        [data]="tableRevDto"
        [actions]="['detail']"
        [tableStyle]="'invopay'"
        [isForSelectItem]="false"
        [scroll]="true"
        [titlesFile]="titlesMap"
        (action)="onTableAction($event)"
        (selectedItemsChange)="onSelectedItems($event)">
      </app-table>
       <app-no-data *ngIf="revenues.length<1"></app-no-data>


    </div>
    <div *ngIf="isMobile" class="card-mobile">
        <div   class="payment-card-mobile-container" *ngFor="let revenue of tableRevDto; let i = index">
            <div class="payment-card-mobile-data">
            <div class="card-header-mobile">
            <span class="card-id-mobile">#{{ revenue.id }}</span>
            <div class="icon-movil-container">
                    <button class="menu-icon-mobile" (click)="toggleMobileMenu(i)">
                        ⋮
                    </button>
                    <ul *ngIf="showMobileMenuIndex === i" class="menu-movil">
                        <li (click)="onMobileMenuAction('detail', revenue)">Revisar</li>
                    </ul>
            </div>
            </div>

      
            <div class="card-body-mobile">

            <div class="info-row-mobile">
                <span class="info-label-mobile">Fecha</span>
                <span class="info-value-mobile">{{ revenue.fecha }}</span>
            </div>
            <div class="info-row-mobile">
                <span class="info-label-mobile">Producto</span>
                <span class="info-value-mobile">{{ revenue.producto }}</span>
            </div>
            <div class="info-row-mobile">
                <span class="info-label-mobile">Canal de pago</span>
                <span class="info-value-mobile">{{ revenue.canalPago }}</span>
            </div>

            <div class="info-row-mobile">
                <span class="info-label-mobile">Proveedor</span>
                <span class="info-value-mobile">{{ revenue.proveedorPago}}</span>
            </div>
            <div class="info-row-mobile">
                <span class="info-label-mobile">Monto Recaudado</span>
                <span class="info-value-mobile">{{revenue.moneda}} {{ revenue.montoRecaudado }}</span>
            </div>
            </div>
        </div>
        <app-no-data *ngIf="revenues.length < 1"></app-no-data>
        </div>
    </div>

  
    <div class="card-paginator"  *ngIf="revenues.length>5">
      <div class="paginator-controls">
        <select class="page-size-select" formControlName="rowPaginator" title="Filas por pagina">
          <option [value]="5">5</option>
          <option [value]="10">10</option>
          <option [value]="20">20</option>
          <option [value]="50">50</option>
        </select>

        <app-paginator
          (pageChange)="onPageChange($event)"
          [totalItems]="revenues.length"
          [itemsPerPage]="itemsPerpage"
          [currentPages]="currentPages">
        </app-paginator>
     </div>
    </div>
  </div>
</form>
